name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes
        run: npm test

  release:
    name: Publicar release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Empacotar extensão
        run: |
          mkdir -p dist
          cd extension && zip -r "../dist/loterias-caixa-turbo-${GITHUB_REF_NAME}.zip" .
      - name: Publicar release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotente: se a tag for reenviada, atualiza o .zip da release existente em vez de falhar.
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
          fi
